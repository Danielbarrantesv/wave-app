# JVM args: 2048m heap, SerialGC friendly (low-memory CI/sandbox friendly)
org.gradle.jvmargs=-Xmx2048m -XX:+UseSerialGC -Dfile.encoding=UTF-8
# No daemon (short-lived sandbox environments)
org.gradle.daemon=false
org.gradle.configureondemand=false
# AndroidX
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
# AGP 8.7.3 building against compileSdk 36
android.suppressUnsupportedCompileSdk=36
kotlin.code.style=official
