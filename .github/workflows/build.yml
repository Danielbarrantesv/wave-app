name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Permite disparar manualmente desde la pestaña Actions

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          sdk-platform: 36
          sdk-build-tools: 36.0.0

      - name: Dar permisos de ejecución a gradlew
        run: chmod +x ./gradlew

      - name: Compilar APK Debug
        run: ./gradlew assembleDebug --no-daemon --max-workers=1 -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=512m"

      - name: Subir APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wave-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
